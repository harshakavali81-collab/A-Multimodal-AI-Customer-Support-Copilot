name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py
      - name: Build baseline container
        run: docker build -t support-copilot:test .
      - name: Check container health
        run: |
          docker run -d --name copilot -p 127.0.0.1:8000:8000 -e PUBLIC_DEMO=1 support-copilot:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs copilot
          exit 1
