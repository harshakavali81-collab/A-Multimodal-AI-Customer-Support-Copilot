<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><rect width="1100" height="740" fill="#f5f8fb"/><style>text{font-family:Arial;fill:#183047} .h{font-size:22px;font-weight:bold}.s{font-size:16px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#087e83"/></marker></defs><rect x="50" y="45" width="300" height="95" rx="14" fill="white" stroke="#b8cbd6"/><text x="68" y="81" class="h">Customer input</text><text x="68" y="113" class="s">Text / screenshots / PDF / audio</text><rect x="50" y="215" width="300" height="95" rx="14" fill="white" stroke="#b8cbd6"/><text x="68" y="251" class="h">Extract and redact</text><text x="68" y="283" class="s">PDF parser / OCR / Whisper</text><rect x="750" y="45" width="300" height="95" rx="14" fill="white" stroke="#b8cbd6"/><text x="768" y="81" class="h">Approved knowledge</text><text x="768" y="113" class="s">Versioned Markdown policies</text><rect x="750" y="215" width="300" height="95" rx="14" fill="white" stroke="#b8cbd6"/><text x="768" y="251" class="h">Chunk and vectorize</text><text x="768" y="283" class="s">TF-IDF or semantic embeddings</text><rect x="390" y="360" width="320" height="95" rx="14" fill="white" stroke="#b8cbd6"/><text x="408" y="396" class="h">Retrieve and draft</text><text x="408" y="428" class="s">Evidence excerpts or local Ollama</text><rect x="390" y="555" width="320" height="95" rx="14" fill="white" stroke="#b8cbd6"/><text x="408" y="591" class="h">Agent review</text><text x="408" y="623" class="s">Approve / reject / escalate</text><path d="M200 140V215" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#a)"/><path d="M900 140V215" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#a)"/><path d="M200 310V408H390" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#a)"/><path d="M900 310V408H710" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#a)"/><path d="M550 455V555" fill="none" stroke="#087e83" stroke-width="3" marker-end="url(#a)"/><text x="740" y="596" class="h">SQLite tickets</text><text x="740" y="625" class="s">Local persistence and history</text><path d="M710 600H730" stroke="#087e83" stroke-width="3" marker-end="url(#a)"/><text x="390" y="702" class="s">Agent approval saves a record. It does not send a message.</text></svg>
